<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Quét CCCD (Hybrid Trí Tuệ)</title>
    <!-- Thư viện dự phòng cho iOS -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary-color: #2563EB;
            --danger-color: #EF4444;
            --success-color: #10B981;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 24px; width: 100%; max-width: 420px;
            text-align: center;
        }

        h1 { font-size: 1.35rem; margin-bottom: 8px; color: #1F2937; }
        .device-badge {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 600; margin-bottom: 20px;
        }
        .badge-android { background-color: #D1FAE5; color: #047857; }
        .badge-ios { background-color: #DBEAFE; color: #1D4ED8; }

        /* --- UI CHO ANDROID (LIVE CAMERA) --- */
        #android-section { display: none; }
        .video-wrapper {
            position: relative; width: 100%; border-radius: 12px;
            background-color: #000; margin-bottom: 15px; aspect-ratio: 4/3;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .scan-line {
            width: 100%; height: 2px; background: #10B981;
            position: absolute; top: 0; animation: scan 2s infinite linear; display: none;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* --- UI CHO IOS (CHỤP ẢNH) --- */
        #ios-section { display: none; padding: 20px 0; }
        input[type="file"] { display: none; }
        .loading { display: none; margin-top: 15px; color: var(--primary-color); font-weight: 600; }

        /* --- NÚT BẤM CHUNG --- */
        .btn {
            padding: 14px 20px; border: none; border-radius: 10px;
            font-size: 1.05rem; font-weight: 600; cursor: pointer;
            color: white; width: 100%; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-start { background-color: var(--primary-color); }
        .btn-stop { background-color: var(--danger-color); display: none; margin-top: 10px;}
        .btn-capture { background-color: var(--primary-color); box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.3); }

        /* --- KẾT QUẢ --- */
        .result-box {
            background-color: #ECFDF5; border: 2px solid #34D399;
            border-radius: 12px; padding: 16px; margin-top: 20px;
            display: none; text-align: left;
        }
        .result-item { margin-bottom: 8px; font-size: 0.95rem; color: #065F46; }
        .result-item strong { color: #047857; display: inline-block; width: 90px; }
        
        /* Div ẩn để khởi tạo thư viện js cho iOS */
        #qr-reader-hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Quét Thông Tin CCCD</h1>
        <div id="device-info" class="device-badge">Đang kiểm tra thiết bị...</div>

        <!-- GIAO DIỆN DÀNH CHO ANDROID (BARCODE API) -->
        <div id="android-section">
            <div class="video-wrapper">
                <video id="video" autoplay playsinline></video>
                <div class="scan-line" id="scan-line"></div>
                <p id="placeholder-text" style="color: #6B7280; font-size: 0.9rem;">Camera đã tắt</p>
            </div>
            <button id="start-btn" class="btn btn-start" onclick="startAndroidCamera()">🎥 Bật Camera Quét</button>
            <button id="stop-btn" class="btn btn-stop" onclick="stopAndroidCamera()">🛑 Tắt Camera</button>
        </div>

        <!-- GIAO DIỆN DÀNH CHO IOS (CAPTURE ẢNH) -->
        <div id="ios-section">
            <label for="camera-input" class="btn btn-capture">📸 Mở Camera Chụp CCCD</label>
            <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="processIOSImage(event)">
            <div id="loading" class="loading">⏳ Đang xử lý hình ảnh siêu tốc...</div>
        </div>

        <!-- KHUNG KẾT QUẢ CHUNG -->
        <div id="result-box" class="result-box">
            <div id="parsed-data"></div>
        </div>
        
        <!-- Element ẩn phục vụ cho Html5Qrcode -->
        <div id="qr-reader-hidden"></div>
    </div>

    <script>
        // --- CÁC BIẾN TOÀN CỤC ---
        const deviceInfo = document.getElementById('device-info');
        const androidSection = document.getElementById('android-section');
        const iosSection = document.getElementById('ios-section');
        const resultBox = document.getElementById('result-box');
        const parsedData = document.getElementById('parsed-data');
        
        // Biến cho Android
        const video = document.getElementById('video');
        const scanLine = document.getElementById('scan-line');
        const placeholderText = document.getElementById('placeholder-text');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        let stream = null;
        let barcodeDetector = null;
        let scanning = false;

        // Biến cho iOS
        let html5QrCode = null;
        const loadingDiv = document.getElementById('loading');

        // --- BƯỚC 1: NHẬN DIỆN THIẾT BỊ LÚC VỪA MỞ TRANG ---
        window.onload = () => {
            // Kiểm tra xem có phải iOS không (iPhone, iPad, iPod)
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            
            // Kiểm tra xem trình duyệt có lõi BarcodeDetector gốc không
            const hasBarcodeAPI = ('BarcodeDetector' in window);

            if (!isIOS && hasBarcodeAPI) {
                // LÀ ANDROID VÀ CÓ HỖ TRỢ API GỐC
                deviceInfo.innerText = "🤖 Chế độ siêu tốc (Android Native)";
                deviceInfo.className = "device-badge badge-android";
                androidSection.style.display = 'block';
                
                try {
                    barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
                } catch(e) {
                    // Nếu lỗi khởi tạo, tự động rớt về chế độ iOS (dự phòng)
                    fallbackToIOSMode();
                }
            } else {
                // LÀ IPHONE HOẶC TRÌNH DUYỆT KHÔNG HỖ TRỢ
                fallbackToIOSMode();
            }
        };

        function fallbackToIOSMode() {
            deviceInfo.innerText = "🍎 Chế độ chụp nét (iOS / Fallback)";
            deviceInfo.className = "device-badge badge-ios";
            iosSection.style.display = 'block';
            androidSection.style.display = 'none';
            // Khởi tạo engine quét từ ảnh cho iOS
            html5QrCode = new Html5Qrcode("qr-reader-hidden");
        }


        // --- BƯỚC 2: LOGIC QUÉT DÀNH RIÊNG CHO ANDROID ---
        async function startAndroidCamera() {
            resultBox.style.display = 'none';
            try {
                // Mở luồng Full HD
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
                video.style.display = 'block';
                placeholderText.style.display = 'none';
                scanLine.style.display = 'block';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';

                video.onloadedmetadata = () => {
                    scanning = true;
                    requestAnimationFrame(scanLoop);
                };
            } catch (err) {
                alert("Lỗi mở camera Android: " + err.message);
                fallbackToIOSMode(); // Cứu cánh: Lỗi camera thì ném qua chế độ chụp ảnh
            }
        }

        async function scanLoop() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA && barcodeDetector) {
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes.length > 0) {
                        displayResult(barcodes[0].rawValue);
                        stopAndroidCamera();
                        return; // Quét xong thì dừng vòng lặp
                    }
                } catch (e) {
                    console.error(e);
                }
            }
            requestAnimationFrame(scanLoop); // Lặp lại liên tục
        }

        function stopAndroidCamera() {
            scanning = false;
            if (stream) stream.getTracks().forEach(track => track.stop());
            video.style.display = 'none';
            scanLine.style.display = 'none';
            placeholderText.style.display = 'block';
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
        }


        // --- BƯỚC 3: LOGIC QUÉT DÀNH RIÊNG CHO IOS (VÀ DỰ PHÒNG) ---
        function processIOSImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            resultBox.style.display = 'none';
            loadingDiv.style.display = 'block';

            html5QrCode.scanFile(file, true)
                .then(decodedText => {
                    loadingDiv.style.display = 'none';
                    displayResult(decodedText);
                })
                .catch(err => {
                    loadingDiv.style.display = 'none';
                    alert("Không tìm thấy mã QR. Hãy đảm bảo bạn đưa CCCD lại gần và chụp rõ nét nhé!");
                });
                
            event.target.value = ''; // Reset để chụp lại được
        }


        // --- BƯỚC 4: HÀM XỬ LÝ KẾT QUẢ CHUNG CHO CẢ 2 HỆ ---
        function displayResult(data) {
            const parts = data.split('|');
            let htmlContent = '';

            // Kiểm tra nếu là chuỗi CCCD
            if (parts.length >= 6) {
                htmlContent = `
                    <div class="result-item"><strong>Số CCCD:</strong> ${parts[0]}</div>
                    <div class="result-item"><strong>CMND cũ:</strong> ${parts[1]}</div>
                    <div class="result-item"><strong>Họ tên:</strong> ${parts[2]}</div>
                    <div class="result-item"><strong>Ngày sinh:</strong> ${parts[3]}</div>
                    <div class="result-item"><strong>Giới tính:</strong> ${parts[4]}</div>
                    <div class="result-item"><strong>Địa chỉ:</strong> ${parts[5]}</div>
                `;
            } else {
                htmlContent = `<div class="result-item"><strong>Kết quả:</strong> ${data}</div>`;
            }

            parsedData.innerHTML = htmlContent;
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
