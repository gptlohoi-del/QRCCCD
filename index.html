<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Nhận Diện Khuôn Mặt</title>
    
    <!-- Thư viện quét QR cho iOS -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Thư viện Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Thư viện Cắt ảnh (Crop) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        :root { --primary-color: #2563EB; --danger-color: #EF4444; --success-color: #10B981; --bg-color: #F3F4F6; --card-bg: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-color); display: flex; justify-content: center; min-height: 100vh; padding: 15px; align-items: flex-start;}
        
        .container { background-color: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); padding: 24px; width: 100%; max-width: 420px; text-align: center; margin-top: 20px;}
        h1 { font-size: 1.35rem; margin-bottom: 8px; color: #1F2937; }
        .device-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 20px; }
        .badge-android { background-color: #D1FAE5; color: #047857; } .badge-ios { background-color: #DBEAFE; color: #1D4ED8; }

        /* UI Camera */
        #android-section { display: none; }
        .video-wrapper { position: relative; width: 100%; border-radius: 12px; background-color: #000; margin-bottom: 15px; aspect-ratio: 4/3; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        #ios-section { display: none; padding: 10px 0; }
        
        /* UI Form điền thông tin */
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; color: #374151;}
        .form-control { width: 100%; padding: 10px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 1rem; }
        .form-control[readonly] { background-color: #F3F4F6; }
        
        /* UI Nút bấm */
        .btn { padding: 14px 20px; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 600; cursor: pointer; color: white; width: 100%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px;}
        .btn-start { background-color: var(--primary-color); }
        .btn-stop { background-color: var(--danger-color); display: none; }
        .btn-success { background-color: var(--success-color); }
        
        /* Modal Crop Ảnh */
        #crop-modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.9); z-index: 999; flex-direction: column; padding: 20px;}
        .crop-container { width: 100%; height: 70vh; background: #333; margin-bottom: 20px;}
        
        /* Ảnh đã crop */
        .cropped-preview { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .cropped-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid var(--success-color); }
        
        #registration-form { display: none; margin-top: 20px; padding-top: 20px; border-top: 2px dashed #E5E7EB; }
        #qr-reader-hidden { display: none; }
        .overlay-loading { display:none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.8); z-index: 1000; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem;}
    </style>
</head>
<body>

    <div class="container">
        <h1>Quét CCCD & Chụp Ảnh</h1>
        <div id="device-info" class="device-badge">Đang kiểm tra thiết bị...</div>

        <!-- CAMERA SCAN QR -->
        <div id="android-section">
            <div class="video-wrapper">
                <video id="video" autoplay playsinline></video>
                <p id="placeholder-text" style="color: #6B7280; font-size: 0.9rem;">Camera đã tắt</p>
            </div>
            <button id="start-btn" class="btn btn-start" onclick="startAndroidCamera()">🎥 Bật Camera Quét</button>
            <button id="stop-btn" class="btn btn-stop" onclick="stopAndroidCamera()">🛑 Tắt Camera</button>
        </div>
        <div id="ios-section">
            <label for="camera-input-qr" class="btn btn-start">📸 Mở Camera Quét CCCD</label>
            <input type="file" id="camera-input-qr" accept="image/*" capture="environment" onchange="processIOSImage(event)" style="display:none;">
        </div>

        <!-- FORM ĐIỀN THÔNG TIN (Ẩn cho đến khi quét QR xong) -->
        <div id="registration-form">
            <h3 style="margin-bottom: 15px; color: var(--success-color);">Thêm Dữ Liệu Thành Công</h3>
            
            <div class="form-group">
                <label>Họ và Tên (Từ CCCD)</label>
                <input type="text" id="ho_ten" class="form-control" readonly>
            </div>
            <div class="form-group">
                <label>Số CCCD</label>
                <input type="text" id="cccd_number" class="form-control" readonly>
            </div>
            <div class="form-group">
                <label>Pháp Danh</label>
                <input type="text" id="phap_danh" class="form-control" placeholder="Nhập pháp danh...">
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" id="sdt" class="form-control" placeholder="Nhập số điện thoại...">
            </div>
            <div class="form-group">
                <label>Đạo Tràng</label>
                <select id="dao_trang_id" class="form-control">
                    <option value="">-- Chọn Đạo Tràng --</option>
                </select>
            </div>

            <!-- CHỤP ẢNH KHUÔN MẶT -->
            <div class="form-group" style="margin-top: 20px;">
                <label>Ảnh Khuôn Mặt (Có thể chụp nhiều ảnh)</label>
                <label for="face-input" class="btn btn-start" style="background: #4B5563;">📸 Thêm ảnh khuôn mặt</label>
                <input type="file" id="face-input" accept="image/*" capture="environment" style="display:none;" onchange="openCropper(event)">
                <div id="preview-container" class="cropped-preview"></div>
            </div>

            <button class="btn btn-success" onclick="submitToSupabase()">Gửi Dữ Liệu Lên Server</button>
        </div>
        
        <div id="qr-reader-hidden"></div>
    </div>

    <!-- MODAL CROP ẢNH -->
    <div id="crop-modal">
        <h3 style="color:white; text-align:center; margin-bottom:10px;">Căn chỉnh khuôn mặt</h3>
        <div class="crop-container"><img id="crop-image" src=""></div>
        <button class="btn btn-success" onclick="finishCrop()">✅ Cắt Ảnh & Lưu</button>
        <button class="btn btn-stop" style="display:block;" onclick="closeCropper()">❌ Hủy</button>
    </div>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="overlay-loading">⏳ Đang xử lý...</div>

    <script>
        // ==========================================
        // CẤU HÌNH SUPABASE Ở ĐÂY
        // ==========================================
        const SUPABASE_URL = 'https://rdmqtewpxizvyqjjmkss.supabase.co'; // Sửa link
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkbXF0ZXdweGl6dnlxampta3NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTY0MjksImV4cCI6MjEwNDI3MjQyOX0.Ng2X_leEmkDWPBt51Du5OaclOIzTia5OtAmMa6CXAqc'; // Sửa key
        const BUCKET_NAME = 'faces'; // Tên bucket lưu ảnh

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // ==========================================
        // BIẾN TOÀN CỤC
        // ==========================================
        let rawQRString = "";
        let croppedImagesFiles = []; // Mảng chứa các file ảnh đã crop (dạng Blob)
        let cropperInstance = null;
        
        // Lấy mã thiết bị từ LocalStorage (hoặc tạo mới)
        let maThietBi = localStorage.getItem('ma_thiet_bi');
        if(!maThietBi) {
            maThietBi = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('ma_thiet_bi', maThietBi);
        }

        // ==========================================
        // KHỞI TẠO (Load danh sách đạo tràng)
        // ==========================================
        window.onload = async () => {
            detectDevice();
            // Load danh sách Đạo tràng từ Supabase
            try {
                const { data, error } = await supabase.from('danh_muc_dao_trang').select('id, ten_dao_trang');
                if (data) {
                    const select = document.getElementById('dao_trang_id');
                    data.forEach(item => {
                        select.innerHTML += `<option value="${item.id}">${item.ten_dao_trang}</option>`;
                    });
                }
            } catch (e) {
                console.log("Chưa cấu hình Supabase hợp lệ để load Đạo Tràng");
            }
        };

        // ... (GIỮ NGUYÊN CÁC HÀM QUÉT QR CHO ANDROID VÀ IOS CỦA BẠN: detectDevice, fallbackToIOSMode, startAndroidCamera, scanLoop, stopAndroidCamera, processIOSImage) ...
        // ĐỂ GỌN, TÔI TÓM TẮT HÀM XỬ LÝ KẾT QUẢ QR DƯỚI ĐÂY:

        function displayResult(data) {
            rawQRString = data;
            const parts = data.split('|');
            if (parts.length >= 6) {
                document.getElementById('cccd_number').value = parts[0];
                document.getElementById('ho_ten').value = parts[2];
            } else {
                alert("Mã QR không hợp lệ hoặc không phải CCCD");
                return;
            }
            // Ẩn camera, hiện form
            if (typeof stopAndroidCamera === "function") stopAndroidCamera();
            document.getElementById('android-section').style.display = 'none';
            document.getElementById('ios-section').style.display = 'none';
            document.getElementById('registration-form').style.display = 'block';
        }

        // ==========================================
        // XỬ LÝ CROP ẢNH KHUÔN MẶT
        // ==========================================
        function openCropper(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('crop-image').src = e.target.result;
                document.getElementById('crop-modal').style.display = 'flex';
                
                if (cropperInstance) cropperInstance.destroy();
                cropperInstance = new Cropper(document.getElementById('crop-image'), {
                    aspectRatio: 1, // Bắt buộc cắt hình vuông (Tối ưu cho nhận diện khuôn mặt)
                    viewMode: 1,
                    autoCropArea: 0.8
                });
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function closeCropper() {
            document.getElementById('crop-modal').style.display = 'none';
            if (cropperInstance) cropperInstance.destroy();
        }

        function finishCrop() {
            if (!cropperInstance) return;
            // Resize ảnh về 500x500 để siêu nhẹ (Khoảng 20-50KB/ảnh)
            const canvas = cropperInstance.getCroppedCanvas({ width: 500, height: 500 });
            
            canvas.toBlob((blob) => {
                // Hiển thị Preview
                const url = URL.createObjectURL(blob);
                document.getElementById('preview-container').innerHTML += `<img src="${url}">`;
                
                // Lưu vào mảng để chờ upload
                croppedImagesFiles.push(blob);
                closeCropper();
            }, 'image/jpeg', 0.8);
        }

        // ==========================================
        // GỬI DỮ LIỆU LÊN SUPABASE
        // ==========================================
        async function submitToSupabase() {
            if(croppedImagesFiles.length === 0) {
                alert("Vui lòng chụp ít nhất 1 ảnh khuôn mặt!");
                return;
            }
            const cccd = document.getElementById('cccd_number').value;
            if(!cccd) return alert("Chưa có thông tin CCCD!");

            showLoading(true);

            let uploadedUrls = [];
            let storagePaths = [];

            try {
                // 1. UPLOAD TẤT CẢ ẢNH LÊN STORAGE
                for (let i = 0; i < croppedImagesFiles.length; i++) {
                    const blob = croppedImagesFiles[i];
                    const fileName = `${cccd}_${Date.now()}_${i}.jpg`;
                    
                    const { data, error } = await supabase.storage.from(BUCKET_NAME).upload(fileName, blob);
                    if (error) throw error;

                    // Lấy link public
                    const { data: publicUrlData } = supabase.storage.from(BUCKET_NAME).getPublicUrl(fileName);
                    
                    uploadedUrls.push(publicUrlData.publicUrl);
                    storagePaths.push(fileName);
                }

                // 2. GHI THÔNG TIN VÀO BẢNG dang_ky_ra_vao
                const formData = {
                    subject_id: cccd, // Dùng CCCD làm mã định danh cho CompreFace
                    ma_thiet_bi: maThietBi,
                    ho_ten: document.getElementById('ho_ten').value,
                    cccd_number: cccd,
                    phap_danh: document.getElementById('phap_danh').value,
                    sdt_lien_lac: document.getElementById('sdt').value,
                    dao_trang_id: document.getElementById('dao_trang_id').value ? parseInt(document.getElementById('dao_trang_id').value) : null,
                    qr_cccd: rawQRString,
                    image_urls: uploadedUrls, // Dạng mảng text[]
                    storage_file_paths: storagePaths, // Dạng mảng text[]
                    approval_status: 'cho_duyet',
                    is_synced: false
                };

                const { error: insertError } = await supabase.from('dang_ky_ra_vao').insert([formData]);
                if (insertError) throw insertError;

                alert("✅ Đăng ký thành công!");
                window.location.reload(); // Tải lại trang để đăng ký người mới

            } catch (err) {
                alert("Lỗi: " + err.message);
            } finally {
                showLoading(false);
            }
        }

        function showLoading(show) {
            document.getElementById('loading-screen').style.display = show ? 'flex' : 'none';
        }
        
        // (Ghi chú: Hãy paste các hàm startAndroidCamera, processIOSImage... từ file cũ của bạn xuống đây)
    </script>
</body>
</html>
