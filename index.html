<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Quét Mã QR CCCD</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary-color: #4F46E5;
            --danger-color: #EF4444;
            --success-color: #10B981;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 1.35rem;
            margin-bottom: 15px;
        }

        .tab-hint {
            font-size: 0.85rem;
            color: #6B7280;
            margin-bottom: 20px;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px dashed #D1D5DB;
            margin-bottom: 15px;
            min-height: 220px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-start { background-color: var(--primary-color); }
        .btn-stop { background-color: var(--danger-color); display: none; }
        
        /* Nút tải ảnh lên để quét CCCD cực nét */
        .btn-upload {
            background-color: #D97706; 
            display: block;
            text-align: center;
            line-height: normal;
        }

        input[type="file"] {
            display: none;
        }

        .result-box {
            background-color: #EFF6FF;
            border: 1px solid #BFDBFE;
            border-radius: 8px;
            padding: 16px;
            margin-top: 10px;
            word-break: break-all;
            display: none;
            text-align: left;
        }

        .result-title {
            font-size: 0.875rem;
            color: #3B82F6;
            margin-bottom: 8px;
            font-weight: 600;
        }

        #result-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1E3A8A;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .btn-copy {
            background-color: var(--success-color);
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Quét Mã QR CCCD</h1>
        <p class="tab-hint">💡 Mẹo: Quét trực tiếp camera khó, hãy dùng nút <b>Chụp/Tải ảnh CCCD</b> bên dưới để quét chính xác 100%.</p>
        
        <!-- Khung camera -->
        <div id="reader"></div>
        
        <div class="controls">
            <button id="start-btn" class="btn btn-start" onclick="startScanner()">Bật Camera quét</button>
            <button id="stop-btn" class="btn btn-stop" onclick="stopScanner()">Tắt Camera</button>
            
            <!-- Nút chọn ảnh từ máy / chụp trực tiếp bằng camera hệ thống -->
            <label for="qr-input-file" class="btn btn-upload">📸 Chụp hoặc Chọn ảnh CCCD từ máy</label>
            <input type="file" id="qr-input-file" accept="image/*" onchange="scanImageFromFile(event)">
        </div>

        <!-- Kết quả -->
        <div id="result-box" class="result-box">
            <div class="result-title">Kết quả dữ liệu CCCD:</div>
            <div id="result-text"></div>
            <button id="copy-btn" class="btn btn-copy" onclick="copyResult()">Sao chép kết quả</button>
        </div>
    </div>

    <script>
        let html5QrCode;
        
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resultBox = document.getElementById('result-box');
        const resultText = document.getElementById('result-text');

        function handleScanSuccess(decodedText) {
            resultText.innerText = decodedText;
            resultBox.style.display = 'block';
            stopScanner();
        }

        // 1. Quét qua Camera trực tiếp
        async function startScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            resultBox.style.display = 'none';

            try {
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 15, qrbox: { width: 280, height: 280 } },
                    handleScanSuccess
                );
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
            } catch (err) {
                alert("Không mở được camera. Hãy chắc chắn bạn cấp quyền và dùng HTTPS/Localhost.");
            }
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    startBtn.style.display = 'block';
                    stopBtn.style.display = 'none';
                }).catch(err => console.log(err));
            }
        }

        // 2. Quét bằng cách tải file ảnh lên (KHUYÊN DÙNG CHO CCCD)
        function scanImageFromFile(e) {
            if (e.target.files.length == 0) return;
            const imageFile = e.target.files[0];
            
            // Dừng camera nếu đang bật
            stopScanner();

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    handleScanSuccess(decodedText);
                })
                .catch(err => {
                    alert("Không tìm thấy mã QR trong ảnh này. Hãy chắc chắn ảnh chụp cận cảnh, rõ nét mã QR trên CCCD!");
                    console.error(err);
                });
        }

        function copyResult() {
            navigator.clipboard.writeText(resultText.innerText).then(() => {
                alert('Đã sao chép vào bộ nhớ tạm!');
            });
        }
    </script>
</body>
</html>
