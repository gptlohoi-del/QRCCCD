<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Quét Mã QR CCCD (Có Zoom)</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary-color: #4F46E5;
            --danger-color: #EF4444;
            --success-color: #10B981;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 1.35rem;
            margin-bottom: 15px;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px dashed #D1D5DB;
            margin-bottom: 15px;
            min-height: 220px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Thanh trượt Zoom */
        .zoom-controls {
            display: none; /* Sẽ hiện lên khi camera hỗ trợ Zoom */
            background: #F3F4F6;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
        }

        .zoom-controls label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .zoom-controls input[type="range"] {
            width: 100%;
            accent-color: var(--primary-color);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            width: 100%;
        }

        .btn-start { background-color: var(--primary-color); }
        .btn-stop { background-color: var(--danger-color); display: none; }
        .btn-upload {
            background-color: #D97706; 
            display: block;
            text-align: center;
            line-height: normal;
        }

        input[type="file"] { display: none; }

        .result-box {
            background-color: #EFF6FF;
            border: 1px solid #BFDBFE;
            border-radius: 8px;
            padding: 16px;
            margin-top: 10px;
            word-break: break-all;
            display: none;
            text-align: left;
        }

        .result-title {
            font-size: 0.875rem;
            color: #3B82F6;
            margin-bottom: 8px;
            font-weight: 600;
        }

        #result-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1E3A8A;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Quét Mã QR CCCD</h1>
        
        <div id="reader"></div>

        <!-- Khung điều chỉnh Zoom -->
        <div id="zoom-controls" class="zoom-controls">
            <label for="zoom-slider">Mức Zoom: <span id="zoom-val">2.0</span>x</label>
            <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="2">
        </div>
        
        <div class="controls">
            <button id="start-btn" class="btn btn-start" onclick="startScanner()">Bật Camera quét</button>
            <button id="stop-btn" class="btn btn-stop" onclick="stopScanner()">Tắt Camera</button>
            
            <label for="qr-input-file" class="btn btn-upload">📸 Chụp hoặc Chọn ảnh CCCD</label>
            <input type="file" id="qr-input-file" accept="image/*" onchange="scanImageFromFile(event)">
        </div>

        <div id="result-box" class="result-box">
            <div class="result-title">Kết quả dữ liệu CCCD:</div>
            <div id="result-text"></div>
        </div>
    </div>

    <script>
        let html5QrCode;
        let videoTrack; // Biến lưu trữ luồng camera để điều khiển zoom
        
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resultBox = document.getElementById('result-box');
        const resultText = document.getElementById('result-text');
        const zoomControls = document.getElementById('zoom-controls');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomVal = document.getElementById('zoom-val');

        function handleScanSuccess(decodedText) {
            resultText.innerText = decodedText;
            resultBox.style.display = 'block';
            stopScanner();
        }

        async function startScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            resultBox.style.display = 'none';

            try {
                // Khởi động camera
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 15, qrbox: { width: 280, height: 280 } },
                    handleScanSuccess
                );

                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';

                // --- XỬ LÝ TỰ ĐỘNG ZOOM ---
                // Lấy luồng video đang chạy
                videoTrack = html5QrCode.getRunningTrack();
                if (videoTrack) {
                    const capabilities = videoTrack.getCapabilities();
                    
                    // Kiểm tra xem trình duyệt/máy có hỗ trợ can thiệp Zoom không
                    if ('zoom' in capabilities) {
                        const minZoom = capabilities.zoom.min || 1;
                        const maxZoom = capabilities.zoom.max || 5;
                        const step = capabilities.zoom.step || 0.1;

                        // Cấu hình thanh trượt theo giới hạn của thiết bị
                        zoomSlider.min = minZoom;
                        zoomSlider.max = maxZoom;
                        zoomSlider.step = step;

                        // Đặt mức Zoom mặc định là 2.0 (Nếu máy không tới 2.0 thì lấy max của máy)
                        let defaultZoom = Math.min(maxZoom, 2.0);
                        defaultZoom = Math.max(minZoom, defaultZoom);

                        zoomSlider.value = defaultZoom;
                        zoomVal.innerText = defaultZoom;
                        zoomControls.style.display = 'block'; // Hiện thanh trượt

                        // Lập tức áp dụng mức Zoom 2.0 vào camera
                        await videoTrack.applyConstraints({ advanced: [{ zoom: defaultZoom }] });

                        // Lắng nghe người dùng kéo thanh trượt để đổi Zoom
                        zoomSlider.oninput = async function(e) {
                            const zValue = parseFloat(e.target.value);
                            zoomVal.innerText = zValue;
                            await videoTrack.applyConstraints({ advanced: [{ zoom: zValue }] });
                        }
                    } else {
                        console.log("Thiết bị hoặc trình duyệt không hỗ trợ API tự động Zoom.");
                    }
                }
            } catch (err) {
                alert("Lỗi camera: " + err);
            }
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    startBtn.style.display = 'block';
                    stopBtn.style.display = 'none';
                    zoomControls.style.display = 'none'; // Ẩn thanh trượt
                }).catch(err => console.log(err));
            }
        }

        function scanImageFromFile(e) {
            if (e.target.files.length == 0) return;
            const imageFile = e.target.files[0];
            stopScanner();
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    handleScanSuccess(decodedText);
                })
                .catch(err => {
                    alert("Không tìm thấy mã QR. Hãy chụp rõ nét hơn!");
                });
        }
    </script>
</body>
</html>
