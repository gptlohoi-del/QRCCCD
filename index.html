<!DOCTYPE html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Quét CCCD (Native API)</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 1.35rem;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 0.85rem;
            color: #10B981;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* Khu vực Video */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            margin-bottom: 20px;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Ẩn khi chưa bật */
        }

        /* Khung nhắm mục tiêu giả lập */
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            display: none;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4); /* Làm tối xung quanh */
        }
        
        .scan-line {
            width: 100%;
            height: 2px;
            background: #10B981;
            position: absolute;
            top: 0;
            animation: scan 2s infinite linear;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            width: 100%;
            background-color: var(--primary-color);
            transition: 0.2s;
            margin-bottom: 10px;
        }

        button:active { transform: scale(0.98); }
        .btn-stop { background-color: #EF4444; display: none; }

        .result-box {
            background-color: #EFF6FF;
            border: 1px solid #BFDBFE;
            border-radius: 8px;
            padding: 16px;
            margin-top: 10px;
            display: none;
            text-align: left;
        }

        #result-text {
            font-size: 0.95rem;
            color: #1E3A8A;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        
        .error-msg {
            color: #EF4444;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Siêu Quét QR CCCD</h1>
        <p class="desc">⚡ Sử dụng Native Lens API & HD Camera</p>
        
        <div id="error-msg" class="error-msg"></div>

        <div class="video-wrapper">
            <video id="video" autoplay playsinline></video>
            <div class="scan-overlay" id="scan-overlay">
                <div class="scan-line"></div>
            </div>
            <p id="placeholder-text" style="color: #6B7280; font-size: 0.9rem;">Camera đang tắt</p>
        </div>
        
        <button id="start-btn" onclick="startCamera()">Bật Camera Trực Tiếp</button>
        <button id="stop-btn" class="btn-stop" onclick="stopCamera()">Tắt Camera</button>

        <div id="result-box" class="result-box">
            <div style="font-weight: bold; color: #3B82F6; margin-bottom: 8px;">Dữ liệu thẻ:</div>
            <div id="result-text"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const overlay = document.getElementById('scan-overlay');
        const placeholderText = document.getElementById('placeholder-text');
        const resultBox = document.getElementById('result-box');
        const resultText = document.getElementById('result-text');
        const errorMsg = document.getElementById('error-msg');

        let stream = null;
        let barcodeDetector = null;
        let scanning = false;

        // Kiểm tra xem trình duyệt có hỗ trợ BarcodeDetector API không (Native API)
        async function initDetector() {
            if (!('BarcodeDetector' in window)) {
                showError("Trình duyệt không hỗ trợ Native Barcode API. Vui lòng mở bằng Chrome trên Android để có hiệu năng tốt nhất.");
                return false;
            }
            
            try {
                // Khởi tạo công cụ quét gốc của Google
                barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
                return true;
            } catch (e) {
                showError("Lỗi khởi tạo AI nhận diện: " + e.message);
                return false;
            }
        }

        async function startCamera() {
            errorMsg.style.display = 'none';
            resultBox.style.display = 'none';

            const hasDetector = await initDetector();
            if (!hasDetector) return;

            try {
                // ÉP CAMERA MỞ ĐỘ PHÂN GIẢI FULL HD (1920x1080) ĐỂ BẮT NÉT CCCD
                const constraints = {
                    video: { 
                        facingMode: "environment", // Camera sau
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.style.display = 'block';
                placeholderText.style.display = 'none';
                overlay.style.display = 'block';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';

                // Bắt đầu vòng lặp quét sau khi video đã tải lên
                video.onloadedmetadata = () => {
                    scanning = true;
                    requestAnimationFrame(scanLoop);
                };

            } catch (err) {
                showError("Không thể truy cập camera. Vui lòng kiểm tra quyền! (" + err.message + ")");
            }
        }

        // Vòng lặp quét siêu tốc
        async function scanLoop() {
            if (!scanning) return;

            // Đảm bảo video đang chạy thì mới quét
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                try {
                    // Giao toàn bộ việc nhận diện cho API gốc của hệ điều hành
                    const barcodes = await barcodeDetector.detect(video);
                    
                    if (barcodes.length > 0) {
                        // Tìm thấy mã QR
                        const result = barcodes[0].rawValue;
                        handleSuccess(result);
                        return; // Dừng vòng lặp
                    }
                } catch (e) {
                    console.error("Lỗi quét:", e);
                }
            }
            
            // Nếu chưa tìm thấy, tiếp tục quét ở khung hình tiếp theo (60fps)
            requestAnimationFrame(scanLoop);
        }

        function handleSuccess(data) {
            stopCamera();
            
            // Xử lý tách chuỗi CCCD (CCCD phân cách bằng ký tự | )
            const parts = data.split('|');
            let formattedText = data; // Mặc định hiển thị chuỗi gốc

            if (parts.length >= 6) {
                formattedText = `🔹 Số CCCD: ${parts[0]}\n` +
                                `🔹 CMND cũ: ${parts[1]}\n` +
                                `🔹 Họ và tên: ${parts[2]}\n` +
                                `🔹 Ngày sinh: ${parts[3]}\n` +
                                `🔹 Giới tính: ${parts[4]}\n` +
                                `🔹 Nơi thường trú: ${parts[5]}\n` +
                                `🔹 Ngày cấp: ${parts[6] || 'Không có'}`;
            }

            resultText.innerText = formattedText;
            resultBox.style.display = 'block';
        }

        function stopCamera() {
            scanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.style.display = 'none';
            overlay.style.display = 'none';
            placeholderText.style.display = 'block';
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
        }

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
